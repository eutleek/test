<script>
(function initColors() {
  const layoutDefaultVersion = 'v143-magazine-default';
  if (localStorage.getItem('layoutDefaultVersion') !== layoutDefaultVersion) {
    localStorage.setItem('layout', 'minimal');
    localStorage.setItem('layoutDefaultVersion', layoutDefaultVersion);
  }

  const savedLayout = localStorage.getItem('layout') || 'minimal';
  const backgroundStorageKey = 'kisstr_background_picker_selection_v1';
  let savedBackgroundOption = null;
  let isSavedImageBackground = false;
  let shouldUseImageBackground = false;
try {
    const savedBackground = localStorage.getItem(backgroundStorageKey);
    savedBackgroundOption = savedBackground ? JSON.parse(savedBackground) : null;
    isSavedImageBackground = !!(savedBackgroundOption && savedBackgroundOption.type === 'image' && savedBackgroundOption.url);
    shouldUseImageBackground = isSavedImageBackground || !savedBackgroundOption;
} catch (err) {
    savedBackgroundOption = null;
    isSavedImageBackground = false;
    shouldUseImageBackground = false;
  }

  const metaThemeColor = document.querySelector('meta[name="theme-color"]');

  if (shouldUseImageBackground) {
    let bgImageValue = '';
    if (isSavedImageBackground) {
      const bgUrl = String(savedBackgroundOption.url).replace('anime_wallpapers/', 'wallpapers/').replace('.jpg', '.webp');
      const overlay = savedLayout === 'grid'
        ? ['rgba(18, 18, 36, 0.34)', 'rgba(18, 18, 36, 0.43)']
        : ['rgba(18, 18, 36, 0.42)', 'rgba(18, 18, 36, 0.52)'];
      bgImageValue = `linear-gradient(to bottom, ${overlay[0]}, ${overlay[1]}), url('${new URL(bgUrl, document.baseURI).href}')`;
    }

    document.documentElement.classList.add('background-image-mode');
    document.documentElement.classList.add('cards-stabilizing');
    setTimeout(() => document.documentElement.classList.remove('cards-stabilizing'), 1400);
    document.documentElement.style.backgroundColor = '#121224';
    if (bgImageValue) document.documentElement.style.setProperty('--bg-image', bgImageValue);
    if (metaThemeColor) metaThemeColor.setAttribute('content', '#121224');
    return;
  }

  const savedTheme = localStorage.getItem('theme_' + savedLayout) || 'white';
  const themeColors = {
    'white': '#f5f5f7',
    'dawn': '#fff5f5',
    'mint': '#f0fff5',
    'ocean': '#f0f8ff',
    'twilight': '#f5f0ff',
    'midnight': '#000212',
    'starry': '#0c0c1d',
    'sunset': '#2d1b0e',
    'aurora': '#1a2a3a',
    'dream': '#667eea',
    'forest': '#2d5f4e',
    'deepsea': '#1a4a6e',
    'clay': '#6b4a35'
  };

  if (savedLayout === 'minimal') {
    document.documentElement.style.backgroundColor = '#ffffff';
  } else if (themeColors[savedTheme]) {
    document.documentElement.style.backgroundColor = themeColors[savedTheme];
  }

  if (metaThemeColor) {
    if (savedLayout === 'minimal') {
      metaThemeColor.setAttribute('content', '#ffffff');
    } else if (themeColors[savedTheme]) {
      metaThemeColor.setAttribute('content', themeColors[savedTheme]);
    }
  }
})();
</script>

<script>
  (function() {
    var saved = localStorage.getItem('layout') || 'minimal';
    if (saved === 'clear') {
      document.body.classList.add('layout-minimal', 'layout-clear');
    } else {
      document.body.classList.add('layout-' + saved);
    }

    try {
      var savedBackground = localStorage.getItem('kisstr_background_picker_selection_v1');
      var option = savedBackground ? JSON.parse(savedBackground) : null;
      if (!option || (option && option.type === 'image' && option.url)) {
        var bgImageValue = '';
        if (option && option.url) {
          var bgUrl = String(option.url).replace('anime_wallpapers/', 'wallpapers/').replace('.jpg', '.webp');
          var overlay = saved === 'grid'
            ? ['rgba(18, 18, 36, 0.34)', 'rgba(18, 18, 36, 0.43)']
            : ['rgba(18, 18, 36, 0.42)', 'rgba(18, 18, 36, 0.52)'];
          bgImageValue = "linear-gradient(to bottom, " + overlay[0] + ", " + overlay[1] + "), url('" + new URL(bgUrl, document.baseURI).href + "')";
        }
        document.body.classList.add('background-image-mode');
        if (bgImageValue) document.body.style.setProperty('--bg-image', bgImageValue);
        document.documentElement.classList.add('background-image-mode');
        if (bgImageValue) document.documentElement.style.setProperty('--bg-image', bgImageValue);
        document.documentElement.style.backgroundColor = '#121224';
      }
    } catch (err) {}
  })();
</script>
